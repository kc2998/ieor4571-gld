[project]
name = "ieor4571-project"
version = "0.1.0"
description = "Research and backtesting of trading strategies on gold"
authors = [{ name = "Kevin" }]
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    # Core data stack
    "numpy>=2.0",
    "pandas>=2.2,<2.4",
    "pyarrow>=17.0",
    "scipy>=1.13",
    # Market data
    "yfinance>=0.2.50",
    # Plots
    "matplotlib>=3.9",
    # Config files in configs/
    "pyyaml>=6.0",
    # Notebooks and Quarto
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Models for 04_models/ml (opt in with: uv sync --group ml)
ml = [
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# Installs src/gold in editable mode on `uv sync`, so `import gold` works
# from any notebook or script in the repo.
[tool.uv.build-backend]
module-name = "gold"
module-root = "src"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Notebooks import mid file and leave bare expressions for display
"*.ipynb" = ["E402", "B018"]
